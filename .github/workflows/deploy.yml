name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Proxify Stack
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '165.101.215.46' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment on VPS..."
            cd /opt/proxify
            
            echo "📥 Pulling latest changes from GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🔨 Building and restarting Docker containers..."
            docker compose build --no-cache app
            docker compose up -d --force-recreate app backend
            
            echo "🧹 Cleaning up unused Docker artifacts..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
            docker ps --filter name=proxify --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
